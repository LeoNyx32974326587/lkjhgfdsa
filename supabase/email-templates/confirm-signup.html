<!-- Supabase → Authentication → Emails → Templates → "Confirm signup"
     Subject: Bestätige deine E-Mail für Barbook -->
<div style="font-family: Arial, Helvetica, sans-serif; max-width: 480px; margin: 0 auto; padding: 32px 24px; color: #1a1530;">
  <h1 style="font-size: 24px; margin: 0 0 16px;">Willkommen bei Barbook</h1>
  <p style="font-size: 16px; line-height: 1.5; margin: 0 0 24px;">
    Schön, dass du da bist! Bitte bestätige noch deine E-Mail-Adresse, dann ist dein Barbook-Account bereit –
    für deine Songs, Reime, Beats und Lizenzen auf jedem Gerät.
  </p>
  <p style="margin: 0 0 24px;">
    <a href="{{ .ConfirmationURL }}" style="display: inline-block; background: #5a36e8; color: #ffffff; text-decoration: none; font-weight: bold; padding: 14px 28px; border-radius: 999px;">E-Mail bestätigen</a>
  </p>
  <p style="font-size: 14px; line-height: 1.5; color: #6b6585; margin: 0;">
    Du hast dich nicht bei Barbook registriert? Dann ignoriere diese Mail einfach.
  </p>
</div>
