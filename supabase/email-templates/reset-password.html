<!-- Supabase → Authentication → Emails → Templates → "Reset Password"
     Subject: Neues Passwort für Barbook -->
<div style="font-family: Arial, Helvetica, sans-serif; max-width: 480px; margin: 0 auto; padding: 32px 24px; color: #1a1530;">
  <h1 style="font-size: 24px; margin: 0 0 16px;">Neues Passwort für Barbook</h1>
  <p style="font-size: 16px; line-height: 1.5; margin: 0 0 24px;">
    Du hast ein neues Passwort für deinen Barbook-Account angefordert. Klick auf den Knopf und vergib ein neues.
  </p>
  <p style="margin: 0 0 24px;">
    <a href="{{ .ConfirmationURL }}" style="display: inline-block; background: #5a36e8; color: #ffffff; text-decoration: none; font-weight: bold; padding: 14px 28px; border-radius: 999px;">Passwort zurücksetzen</a>
  </p>
  <p style="font-size: 14px; line-height: 1.5; color: #6b6585; margin: 0;">
    Du hast das nicht angefordert? Dann ignoriere diese Mail – dein Passwort bleibt, wie es ist.
  </p>
</div>
